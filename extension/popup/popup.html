<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hackathon Logger</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --error: #ef4444;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .options-link {
      font-size: 12px;
      color: #818cf8;
      text-decoration: none;
      cursor: pointer;
    }
    .options-link:hover {
      text-decoration: underline;
    }

    .field-group {
      margin-bottom: 10px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .field-input, .field-select {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input:focus, .field-select:focus {
      border-color: var(--primary);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-log {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      transition: background 0.15s;
    }

    .btn-log:hover {
      background: var(--primary-hover);
    }

    .btn-log:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: var(--radius);
      font-size: 12px;
      display: none;
      line-height: 1.4;
    }

    .status-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      display: block;
    }

    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      display: block;
    }

    .not-hackathon {
      padding: 20px 10px;
      text-align: center;
      color: var(--text-muted);
    }

    .badge-auto {
      font-size: 10px;
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      padding: 2px 6px;
      border-radius: 9999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span>⚡ Hackathon Logger</span>
      <span class="badge-auto">Active</span>
    </div>
    <a href="#" id="openOptions" class="options-link">⚙️ Options</a>
  </div>

  <div id="contentForm">
    <div class="field-group">
      <label class="field-label" for="hackathonName">Hackathon Name</label>
      <input type="text" id="hackathonName" class="field-input" placeholder="e.g. Build, Ship, Shape">
    </div>

    <div class="row-2">
      <div class="field-group">
        <label class="field-label" for="category">Category</label>
        <input type="text" id="category" class="field-input" placeholder="e.g. AI & Cloud">
      </div>
      <div class="field-group">
        <label class="field-label" for="status">Status</label>
        <select id="status" class="field-select">
          <option value="Open">Open</option>
          <option value="Closed">Closed</option>
        </select>
      </div>
    </div>

    <div class="row-2">
      <div class="field-group">
        <label class="field-label" for="appDeadline">Application Deadline</label>
        <input type="text" id="appDeadline" class="field-input" placeholder="YYYY-MM-DD">
      </div>
      <div class="field-group">
        <label class="field-label" for="pptDeadline">PPT Deadline</label>
        <input type="text" id="pptDeadline" class="field-input" placeholder="YYYY-MM-DD">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="platformFormat">Platform / Format</label>
      <input type="text" id="platformFormat" class="field-input" placeholder="e.g. Devpost (Online)">
    </div>

    <div class="field-group">
      <label class="field-label" for="eventLink">Event Link</label>
      <input type="text" id="eventLink" class="field-input" placeholder="e.g. amazonappdev2026.devpost.com">
    </div>

    <button id="logNowBtn" class="btn-log">
      <span>⚡ Log This Hackathon to Sheet</span>
    </button>
  </div>

  <div id="statusBox" class="status-box"></div>

  <script src="popup.js"></script>
</body>
</html>
